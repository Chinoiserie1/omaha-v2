services:
  postgres:
    image: postgres:16-alpine
    container_name: autopilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autopilot
    ports:
      - "5456:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d autopilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
