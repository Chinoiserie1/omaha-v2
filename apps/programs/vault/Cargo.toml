[package]
name = "omaha-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
bpf-entrypoint = []
test-sbf = []

[dependencies]
pinocchio = "0.9"
pinocchio-system = "0.4"
pinocchio-token = "0.4"
pinocchio-pubkey = "0.2"
pinocchio-log = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
mollusk-svm = "0.7"
mollusk-svm-programs-token = { version = "0.7", features = ["token"] }
solana-pubkey = "3.0"
solana-account = "3.4"
solana-instruction = "3.2"
solana-program-error = "3.0"
solana-program-pack = "3.1"
spl-token-interface = "2.0"
solana-program-option = "3.0"
